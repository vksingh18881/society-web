<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Society Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; color: #1e293b; display: flex; justify-content: center; padding: 50px 20px; }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 500px; }
    h2 { color: #1a5f7a; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    button { width: 100%; padding: 12px; background: #159895; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #117b79; }
    #login-section, #admin-section { display: none; }
    .active { display: block !important; }
    .status { text-align: center; margin-top: 15px; font-weight: bold; color: #159895; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Login Screen -->
    <div id="login-section" class="active">
      <h2>Admin Login</h2>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your secret password">
      </div>
      <button onclick="showAdminPanel()">Continue</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-section">
      <h2>Post a New Notice</h2>
      <div class="form-group">
        <label>Notice Title</label>
        <input type="text" id="notice-title" placeholder="e.g., Water Supply Update">
      </div>
      <div class="form-group">
        <label>Notice Details</label>
        <textarea id="notice-desc" rows="4" placeholder="Write the full message here..."></textarea>
      </div>
      
      <button onclick="publishNotice()" id="publish-btn">Publish Notice to Website</button>
      <div id="status-msg" class="status"></div>
    </div>
  </div>

  <script>
    // Just switches the screen - actual security check happens on the server now
    function showAdminPanel() {
      const pass = document.getElementById('password').value;
      if (!pass) {
        alert("Please enter a password");
        return;
      }
      document.getElementById('login-section').classList.remove('active');
      document.getElementById('admin-section').classList.add('active');
    }

    async function publishNotice() {
      const password = document.getElementById('password').value;
      const title = document.getElementById('notice-title').value;
      const desc = document.getElementById('notice-desc').value;
      const btn = document.getElementById('publish-btn');
      const status = document.getElementById('status-msg');

      if(!title || !desc) {
        alert("Please fill in the title and details!"); return;
      }

      btn.innerText = "Publishing...";
      
      try {
        // Send the data to our secure Vercel backend
        let response = await fetch('/api/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, title, desc })
        });
        
        let result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Failed to publish");
        }

        status.innerText = "Notice Published Successfully!";
        btn.innerText = "Publish Notice to Website";
        
        // Clear form
        document.getElementById('notice-title').value = '';
        document.getElementById('notice-desc').value = '';
        
        setTimeout(() => status.innerText = '', 3000);

      } catch (error) {
        alert(error.message);
        btn.innerText = "Publish Notice to Website";
      }
    }
  </script>
</body>
</html>
